name: Run tests
"on": [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The scripts are POSIX shell and use no GNU-only utility options, so
        # they must work on macOS as well as on Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Run tests
        run: |
          make test
